<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>考勤工具</h1>

      <div class="toolbar" aria-label="考勤操作">
        <label class="button primary" for="excelFile">导入名单</label>
        <input id="excelFile" class="file-input" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
        <button id="exportBtn" class="button" type="button">导出结果</button>
        <button id="clearBtn" class="button danger" type="button">清空记录</button>
        <button id="resetBtn" class="button warning" type="button">全部设为未签到</button>
      </div>
    </header>

    <section class="stats" aria-label="考勤统计">
      <div class="stat-item">
        <span class="stat-label">应到</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">正常</span>
        <strong id="normalCount">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">迟到</span>
        <strong id="lateCount">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">事假</span>
        <strong id="personalLeaveCount">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">病假</span>
        <strong id="sickLeaveCount">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">缺勤</span>
        <strong id="absentCount">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">未签到</span>
        <strong id="uncheckedCount">0</strong>
      </div>
    </section>

    <section class="search-section">
      <input id="searchInput" class="search-input" type="search" placeholder="搜索姓名或编号">
    </section>

    <section class="list-section">
      <div id="studentList" class="student-list"></div>
      <p id="emptyTip" class="empty-tip">请先导入 Excel 学生名单</p>
    </section>
  </main>

  <!-- 优先使用本地 SheetJS；如果本地文件不存在，再尝试 CDN。 -->
  <script src="lib/xlsx.full.min.js"></script>
  <script>
    if (!window.XLSX) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
    }
  </script>
  <script src="lib/pinyin-pro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
